name: MT5 Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backtest=通常のバックテスト / optimize=最適化＋フォワード検証"
        required: false
        type: choice
        options: [backtest, optimize]
        default: backtest
      forward_date:
        description: "optimize のときのフォワード開始日 (YYYY.MM.DD、空なら10か月前の月初)"
        required: false
        default: ""
      from_date:
        description: "開始日 (YYYY.MM.DD、空なら2年前)"
        required: false
        default: ""
      to_date:
        description: "終了日 (YYYY.MM.DD、空なら今日)"
        required: false
        default: ""
      symbol:
        description: "銘柄名 (OANDA の接尾辞込み。空なら変数 MT5_SYMBOL か USDJPY)"
        required: false
        default: ""
      model:
        description: "0=全ティック 1=1分足OHLC 2=始値のみ 4=リアルティック"
        required: false
        default: "1"
      period:
        description: "時間足 (M1 / M5 / M15 / M30 / H1 / H4 / D1)"
        required: false
        default: "H1"
      symbols:
        description: "取引する銘柄（カンマ区切り。空なら EA の既定値）"
        required: false
        default: ""
      preset:
        description: "実運用と同じプリセットを読み込む（MQL5/Presets のファイル名。inputs で個別に上書きできる）"
        required: false
        default: ""
      inputs:
        description: "EA の入力を固定値にする（例: InpRiskPercent=5;InpEntryThreshold=0.5）"
        required: false
        default: ""
      execution:
        description: "約定の遅れ（-1=ランダム遅延 / 0=なし / ミリ秒。空なら backtest=-1, optimize=0）"
        required: false
        default: ""
      deposit:
        description: "初期資金（円。空なら 1000000）"
        required: false
        default: ""
      sample:
        description: "1 にすると、取引の抜粋も reports/runs に保存する（動作確認用）"
        required: false
        default: ""
      timeout_min:
        description: "テスターの制限時間（分、空なら backtest=25 / optimize=80）"
        required: false
        default: ""
  push:
    paths:
      - "MQL5/**"
      - "tools/ci/**"
      - ".github/workflows/mt5-backtest.yml"

# プッシュ時は古い実行を止める。手動実行（workflow_dispatch）は並列に動かせる。
concurrency:
  group: ${{ github.event_name == 'push' && format('mt5-push-{0}', github.ref) || format('mt5-dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  backtest:
    runs-on: windows-latest
    permissions:
      contents: write   # 手動実行の結果（1行要約）を reports/runs/ にコミットするため
    timeout-minutes: 120
    env:
      MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
      MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
      MT5_SERVER: ${{ secrets.MT5_SERVER }}
      MT5_INSTALLER_URL: ${{ vars.MT5_INSTALLER_URL || 'https://download.mql5.com/cdn/web/oanda.corporation/mt5/oanda5setup.exe' }}
      PYTHONIOENCODING: utf-8
      BT_SYMBOL: ${{ inputs.symbol || vars.MT5_SYMBOL || 'USDJPY' }}
      BT_FROM: ${{ inputs.from_date }}
      BT_TO: ${{ inputs.to_date }}
      BT_MODEL: ${{ inputs.model || '1' }}
      BT_MODE: ${{ inputs.mode || 'backtest' }}
      BT_PERIOD: ${{ inputs.period || 'H1' }}
      BT_SYMBOLS: ${{ inputs.symbols }}
      BT_INPUTS: ${{ inputs.inputs }}
      BT_PRESET: ${{ inputs.preset }}
      BT_SAMPLE: ${{ inputs.sample }}
      BT_EXECUTION: ${{ inputs.execution }}
      BT_DEPOSIT: ${{ inputs.deposit }}
      BT_FORWARD: ${{ inputs.forward_date }}
      BT_TIMEOUT_MIN: ${{ inputs.timeout_min || (inputs.mode == 'optimize' && '80') || '25' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install MetaTrader 5
        shell: pwsh
        run: ./tools/ci/install_mt5.ps1

      - name: Compile EA (0 errors / 0 warnings)
        shell: pwsh
        run: ./tools/ci/compile.ps1

      - name: Check secrets
        id: secrets
        shell: pwsh
        run: |
          if ($env:MT5_LOGIN -and $env:MT5_PASSWORD -and $env:MT5_SERVER) {
            "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "### バックテストは未実行" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "シークレット MT5_LOGIN / MT5_PASSWORD / MT5_SERVER が未設定のため、コンパイルのみ行いました。" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Backtest
        if: steps.secrets.outputs.ok == 'true'
        shell: pwsh
        run: ./tools/ci/backtest.ps1

      - name: Summarize
        if: always() && steps.secrets.outputs.ok == 'true'
        shell: pwsh
        run: |
          if ($env:BT_MODE -eq 'optimize') {
            python tools/summarize_opt.py reports
            $md = 'reports/optimize_summary.md'
          } else {
            python tools/summarize_report.py reports
            $md = 'reports/summary.md'
          }
          if (Test-Path $md) { Get-Content $md -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-backtest-reports
          path: reports/
          if-no-files-found: ignore

      - name: Result line
        if: always()
        shell: pwsh
        run: |
          if (Test-Path reports/result_line.txt) { Get-Content reports/result_line.txt -Encoding utf8 } else { Write-Host "RESULT なし" }

      # 手動実行の結果を1行要約としてリポジトリに保存する（多数の検証を比較しやすくするため）。
      # reports/ は push トリガーの対象外なので、このコミットでワークフローは再実行されない。
      - name: Save result line to repository
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          out="$RUNNER_TEMP/run_result.txt"
          {
            echo "run=${GITHUB_RUN_NUMBER} mode=${BT_MODE} period=${BT_PERIOD} model=${BT_MODEL} exec=${BT_EXECUTION:-default} from=${BT_FROM:-default} to=${BT_TO:-default} symbols=${BT_SYMBOLS:-default} deposit=${BT_DEPOSIT:-1000000} preset=${BT_PRESET:-none} inputs=${BT_INPUTS:-default}"
            cat reports/result_line.txt 2>/dev/null || echo "RESULT なし（テスト失敗）"
            # 月ごとの損益率（モンテカルロ分析などに使う）："MONTHLY 2015-01:+1.23,2015-02:-0.45,..."
            if [ -f reports/AMS_monthly.csv ]; then
              awk -F, 'NR>1 && NF>=4 { gsub(/\r/, "", $4); printf "%s%s:%s", (n++ ? "," : "MONTHLY "), $1, $4 } END { if (n) print "" }' reports/AMS_monthly.csv
            fi
            if [ "${BT_SAMPLE:-}" = "1" ]; then cat reports/trade_sample.txt 2>/dev/null || true; fi
          } > "$out"
          # 月 × ルールの損益（どの月にどのルールが負けたかを調べるため）
          rm_out="$RUNNER_TEMP/run_rulemonth.csv"
          if [ -f reports/AMS_rulemonth.csv ]; then tr -d '\r' < reports/AMS_rulemonth.csv > "$rm_out"; fi
          # 全取引（InpExportDeals=true のときだけ。実運用との突き合わせ用）
          dl_out="$RUNNER_TEMP/run_deals.csv"
          if [ -f reports/AMS_bt_deals.csv ]; then tr -d '\r' < reports/AMS_bt_deals.csv > "$dl_out"; fi
          cat "$out"
          git reset -q --hard
          git clean -qfd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            mkdir -p reports/runs
            cp "$out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER").txt"
            if [ -f "$rm_out" ]; then cp "$rm_out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER")_rulemonth.csv"; fi
            if [ -f "$dl_out" ]; then cp "$dl_out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER")_deals.csv"; fi
            git add reports/runs
            git commit -q -m "ci: result of run ${GITHUB_RUN_NUMBER} [skip ci]"
            if git push -q origin HEAD:"$GITHUB_REF_NAME"; then echo "saved"; exit 0; fi
            sleep $((RANDOM % 8 + 2))
          done
          echo "結果の保存に失敗しました（ログの RESULT 行を参照）"
