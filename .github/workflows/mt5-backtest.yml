name: MT5 Backtest

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "backtest=通常のバックテスト / optimize=最適化＋フォワード検証"
        required: false
        type: choice
        options: [backtest, optimize]
        default: backtest
      forward_date:
        description: "optimize のときのフォワード開始日 (YYYY.MM.DD、空なら10か月前の月初)"
        required: false
        default: ""
      from_date:
        description: "開始日 (YYYY.MM.DD、空なら2年前)"
        required: false
        default: ""
      to_date:
        description: "終了日 (YYYY.MM.DD、空なら今日)"
        required: false
        default: ""
      symbol:
        description: "銘柄名 (OANDA の接尾辞込み。空なら変数 MT5_SYMBOL か USDJPY)"
        required: false
        default: ""
      model:
        description: "0=全ティック 1=1分足OHLC 2=始値のみ 4=リアルティック"
        required: false
        default: "1"
      period:
        description: "時間足 (M1 / M5 / M15 / M30 / H1 / H4 / D1)"
        required: false
        default: "H1"
      symbols:
        description: "取引する銘柄（カンマ区切り。空なら EA の既定値）"
        required: false
        default: ""
      preset:
        description: "実運用と同じプリセットを読み込む（MQL5/Presets のファイル名。inputs で個別に上書きできる）"
        required: false
        default: ""
      inputs:
        description: "EA の入力を固定値にする（例: InpRiskPercent=5;InpEntryThreshold=0.5）"
        required: false
        default: ""
      execution:
        description: "約定の遅れ（-1=ランダム遅延 / 0=なし / ミリ秒。空なら backtest=-1, optimize=0）"
        required: false
        default: ""
      deposit:
        description: "初期資金（円。空なら 1000000）"
        required: false
        default: ""
      sample:
        description: "1 にすると、取引の抜粋も reports/runs に保存する（動作確認用）"
        required: false
        default: ""
      timeout_min:
        description: "テスターの制限時間（分、空なら backtest=25 / optimize=80）"
        required: false
        default: ""
      custom:
        description: "仮の銘柄（公開の1分足から作る。カンマ区切り：US500_HD,US100_HD,XAU_HD。空なら使わない）"
        required: false
        default: ""
      account:
        description: "ログインする口座（fx=為替 / index=株価指数CFD / commodity=商品CFD。index と commodity は、それぞれのシークレットが必要）"
        required: false
        type: choice
        options: [fx, index, commodity]
        default: fx
  push:
    paths:
      - "MQL5/**"
      - "tools/ci/**"
      - ".github/workflows/mt5-backtest.yml"

# プッシュ時は古い実行を止める。手動実行（workflow_dispatch）は並列に動かせる。
concurrency:
  group: ${{ github.event_name == 'push' && format('mt5-push-{0}', github.ref) || format('mt5-dispatch-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  # 仮の銘柄（株価指数・金の CFD の代わり）に使う公開の1分足を用意する。口座に CFD の銘柄がなくても、方式 8 を検証できるようにするため。
  # 取得したデータはキャッシュに置き、毎回は取りにいかない（リポジトリには入れない）。
  data:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.custom != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Restore cached data
        id: cache
        uses: actions/cache@v4
        with:
          path: data/custom
          key: histdata-cfd-v1
      - name: Fetch public M1 data (histdata.com)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p data/custom
          bash tools/fetch_histdata.sh SPXUSD 2010 2026 data/custom/US500_HD.csv
          bash tools/fetch_histdata.sh NSXUSD 2010 2026 data/custom/US100_HD.csv
          bash tools/fetch_histdata.sh XAUUSD 2009 2026 data/custom/XAU_HD.csv
          ls -la data/custom
      - uses: actions/upload-artifact@v4
        with:
          name: custom-data
          path: data/custom/*.csv
          retention-days: 2

  backtest:
    needs: [data]
    if: ${{ always() && !cancelled() && (needs.data.result == 'success' || needs.data.result == 'skipped') }}
    runs-on: windows-latest
    permissions:
      contents: write   # 手動実行の結果（1行要約）を reports/runs/ にコミットするため
    timeout-minutes: 120
    env:
      # 口座の種類ごとのシークレット：為替 = MT5_LOGIN / MT5_PASSWORD / MT5_SERVER、
      # 株価指数CFD = MT5_IX_LOGIN / MT5_IX_PASSWORD / MT5_IX_SERVER、商品CFD = MT5_CM_LOGIN / MT5_CM_PASSWORD / MT5_CM_SERVER
      MT5_LOGIN: ${{ (inputs.account == 'index' && secrets.MT5_IX_LOGIN) || (inputs.account == 'commodity' && secrets.MT5_CM_LOGIN) || ((inputs.account == 'fx' || inputs.account == '' || inputs.account == null) && secrets.MT5_LOGIN) || '' }}
      MT5_PASSWORD: ${{ (inputs.account == 'index' && secrets.MT5_IX_PASSWORD) || (inputs.account == 'commodity' && secrets.MT5_CM_PASSWORD) || ((inputs.account == 'fx' || inputs.account == '' || inputs.account == null) && secrets.MT5_PASSWORD) || '' }}
      MT5_SERVER: ${{ (inputs.account == 'index' && secrets.MT5_IX_SERVER) || (inputs.account == 'commodity' && secrets.MT5_CM_SERVER) || ((inputs.account == 'fx' || inputs.account == '' || inputs.account == null) && secrets.MT5_SERVER) || '' }}
      BT_ACCOUNT: ${{ inputs.account || 'fx' }}
      MT5_INSTALLER_URL: ${{ vars.MT5_INSTALLER_URL || 'https://download.mql5.com/cdn/web/oanda.corporation/mt5/oanda5setup.exe' }}
      PYTHONIOENCODING: utf-8
      BT_SYMBOL: ${{ inputs.symbol || vars.MT5_SYMBOL || 'USDJPY' }}
      BT_FROM: ${{ inputs.from_date }}
      BT_TO: ${{ inputs.to_date }}
      BT_MODEL: ${{ inputs.model || '1' }}
      BT_MODE: ${{ inputs.mode || 'backtest' }}
      BT_PERIOD: ${{ inputs.period || 'H1' }}
      BT_SYMBOLS: ${{ inputs.symbols }}
      BT_INPUTS: ${{ inputs.inputs }}
      BT_PRESET: ${{ inputs.preset }}
      BT_SAMPLE: ${{ inputs.sample }}
      BT_EXECUTION: ${{ inputs.execution }}
      BT_DEPOSIT: ${{ inputs.deposit }}
      BT_FORWARD: ${{ inputs.forward_date }}
      BT_TIMEOUT_MIN: ${{ inputs.timeout_min || (inputs.mode == 'optimize' && '80') || '25' }}
      BT_CUSTOM: ${{ inputs.custom }}
      BT_CHART_SYMBOL: ${{ vars.MT5_SYMBOL || 'USDJPY' }}
    steps:
      - uses: actions/checkout@v4

      - name: Download custom symbol data
        if: ${{ inputs.custom != '' }}
        uses: actions/download-artifact@v4
        with:
          name: custom-data
          path: data/custom

      # 実運用のスクリプトが使う、ログの読み取り（tools/ci/lognew.ps1）の動作確認
      - name: Self-test log reader
        shell: pwsh
        run: ./tools/ci/test_lognew.ps1

      - name: Self-test live schedule
        shell: pwsh
        run: ./tools/ci/test_schedule.ps1

      - name: Install MetaTrader 5
        shell: pwsh
        run: ./tools/ci/install_mt5.ps1

      - name: Compile EA (0 errors / 0 warnings)
        shell: pwsh
        run: ./tools/ci/compile.ps1

      - name: Check secrets
        id: secrets
        shell: pwsh
        run: |
          if ($env:MT5_LOGIN -and $env:MT5_PASSWORD -and $env:MT5_SERVER) {
            "ok=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          } else {
            "ok=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            "### バックテストは未実行" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
            "シークレット MT5_LOGIN / MT5_PASSWORD / MT5_SERVER が未設定のため、コンパイルのみ行いました。" | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
          }

      - name: Backtest
        if: steps.secrets.outputs.ok == 'true'
        shell: pwsh
        run: ./tools/ci/backtest.ps1

      - name: Summarize
        if: always() && steps.secrets.outputs.ok == 'true'
        shell: pwsh
        run: |
          if ($env:BT_MODE -eq 'optimize') {
            python tools/summarize_opt.py reports
            $md = 'reports/optimize_summary.md'
          } else {
            python tools/summarize_report.py reports
            $md = 'reports/summary.md'
          }
          if (Test-Path $md) { Get-Content $md -Encoding utf8 | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8 }

      - name: Upload reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mt5-backtest-reports
          path: reports/
          if-no-files-found: ignore

      - name: Result line
        if: always()
        shell: pwsh
        run: |
          if (Test-Path reports/result_line.txt) { Get-Content reports/result_line.txt -Encoding utf8 } else { Write-Host "RESULT なし" }

      # 手動実行の結果を1行要約としてリポジトリに保存する（多数の検証を比較しやすくするため）。
      # reports/ は push トリガーの対象外なので、このコミットでワークフローは再実行されない。
      - name: Save result line to repository
        if: always() && github.event_name == 'workflow_dispatch'
        shell: bash
        run: |
          out="$RUNNER_TEMP/run_result.txt"
          {
            echo "run=${GITHUB_RUN_NUMBER} mode=${BT_MODE} period=${BT_PERIOD} model=${BT_MODEL} exec=${BT_EXECUTION:-default} from=${BT_FROM:-default} to=${BT_TO:-default} symbols=${BT_SYMBOLS:-default} deposit=${BT_DEPOSIT:-1000000} preset=${BT_PRESET:-none} inputs=${BT_INPUTS:-default}${BT_CUSTOM:+ custom=${BT_CUSTOM} symbol=${BT_SYMBOL}} account=${BT_ACCOUNT:-fx}"
            cat reports/result_line.txt 2>/dev/null || echo "RESULT なし（テスト失敗）"
            # 月ごとの損益率（モンテカルロ分析などに使う）："MONTHLY 2015-01:+1.23,2015-02:-0.45,..."
            if [ -f reports/AMS_monthly.csv ]; then
              awk -F, 'NR>1 && NF>=4 { gsub(/\r/, "", $4); printf "%s%s:%s", (n++ ? "," : "MONTHLY "), $1, $4 } END { if (n) print "" }' reports/AMS_monthly.csv
            fi
            if [ "${BT_SAMPLE:-}" = "1" ]; then cat reports/trade_sample.txt 2>/dev/null || true; fi
          } > "$out"
          # 月 × ルールの損益（どの月にどのルールが負けたかを調べるため）
          rm_out="$RUNNER_TEMP/run_rulemonth.csv"
          if [ -f reports/AMS_rulemonth.csv ]; then tr -d '\r' < reports/AMS_rulemonth.csv > "$rm_out"; fi
          # 全取引（InpExportDeals=true のときだけ。実運用との突き合わせ用）
          dl_out="$RUNNER_TEMP/run_deals.csv"
          if [ -f reports/AMS_bt_deals.csv ]; then tr -d '\r' < reports/AMS_bt_deals.csv > "$dl_out"; fi
          # 銘柄の仕様の一覧（InpListSymbols=true のときだけ）
          sy_out="$RUNNER_TEMP/run_symbols.csv"
          if [ -f reports/AMS_symbols.csv ]; then tr -d '\r' < reports/AMS_symbols.csv > "$sy_out"; fi
          cat "$out"
          git reset -q --hard
          git clean -qfd
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5 6 7 8; do
            git fetch -q origin "$GITHUB_REF_NAME"
            git reset -q --hard FETCH_HEAD
            mkdir -p reports/runs
            cp "$out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER").txt"
            if [ -f "$rm_out" ]; then cp "$rm_out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER")_rulemonth.csv"; fi
            if [ -f "$dl_out" ]; then cp "$dl_out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER")_deals.csv"; fi
            if [ -f "$sy_out" ]; then cp "$sy_out" "reports/runs/$(printf '%04d' "$GITHUB_RUN_NUMBER")_symbols.csv"; fi
            git add reports/runs
            git commit -q -m "ci: result of run ${GITHUB_RUN_NUMBER} [skip ci]"
            if git push -q origin HEAD:"$GITHUB_REF_NAME"; then echo "saved"; exit 0; fi
            sleep $((RANDOM % 8 + 2))
          done
          echo "結果の保存に失敗しました（ログの RESULT 行を参照）"
