; ストラテジーテスターの設定テンプレート（tools/backtest.sh が {{...}} を置き換えて使う）
; ログイン情報はここに書かず、tester/credentials.env（git 管理外）か環境変数で渡す
[Common]
Login={{MT5_LOGIN}}
Password={{MT5_PASSWORD}}
Server={{MT5_SERVER}}
KeepPrivate=1
NewsEnable=0

[Tester]
Expert=AdaptiveMultiStrategyEA.ex5
Symbol={{MT5_SYMBOL}}
Period=H1
; 0=全ティック 1=1分足OHLC 2=始値のみ 4=リアルティック
Model=1
Optimization=0
FromDate={{FROM_DATE}}
ToDate={{TO_DATE}}
ForwardMode=0
Deposit=1000000
Currency=JPY
Leverage=1:25
ExecutionMode=0
Visual=0
Report=reports\AMS_{{MT5_SYMBOL}}_H1
ReplaceReport=1
ShutdownTerminal=1
