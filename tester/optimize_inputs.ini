; ここに書かないパラメータは EA の既定値のまま。
; 過去データへの過剰適合を避けるため、対象は「出口の管理」と「エントリーの厳しさ」に絞っている。
InpEntryThreshold=0.45||0.30||0.05||0.70||Y
InpSLATR=1.5||1.0||0.25||2.5||Y
InpTPATR=3.0||2.0||0.5||5.0||Y
InpBETriggerATR=1.0||0.0||0.5||2.0||Y
InpTrailStartATR=1.5||1.0||0.5||3.0||Y
InpTrailDistATR=1.0||0.5||0.5||2.0||Y
InpUseTrend=true||false||0||true||Y
InpUseMeanRev=true||false||0||true||Y
